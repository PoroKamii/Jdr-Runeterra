<style>
/* Runeterra JDR - feuille de style PDF (pandoc -> wkhtmltopdf)
   Palette relevée sur les PDF v1.0 : bordeaux #6b1f1f, bleu nuit #1f3a5f,
   or #c9b98a, parchemin #f8f2e8 / #f0e6cc / #faf7ef, texte #241a12. */
@page { size: A4; }
html { -webkit-print-color-adjust: exact; }
body {
  font-family: "DejaVu Serif", Georgia, serif;
  font-size: 10.5pt;
  line-height: 1.45;
  color: #241a12;
  background: #ffffff;
  margin: 0 !important;
  padding: 0 !important;
  max-width: none !important;
}
header#title-block-header {
  text-align: center;
  border-bottom: 2px solid #6b1f1f;
  margin-bottom: 18px;
  padding-bottom: 6px;
}
header#title-block-header .title {
  font-family: "DejaVu Sans", Arial, sans-serif;
  color: #6b1f1f;
  font-size: 18pt;
  margin: 4px 0;
  border: none;
}
nav#TOC {
  background: #f8f2e8;
  border: 1px solid #c9b98a;
  padding: 10px 18px 14px 18px;
  margin-bottom: 24px;
  page-break-after: always;
  font-family: "DejaVu Sans", Arial, sans-serif;
  font-size: 9pt;
}
nav#TOC::before {
  content: "Sommaire";
  display: block;
  font-size: 14pt;
  color: #6b1f1f;
  border-bottom: 1px solid #c9b98a;
  margin-bottom: 8px;
  padding-bottom: 4px;
}
nav#TOC ul { list-style: none; padding-left: 14px; margin: 0; }
nav#TOC > ul { padding-left: 0; }
nav#TOC li { margin: 1px 0; }
nav#TOC a { color: #1f3a5f; text-decoration: none; }
h1, h2, h3, h4 {
  font-family: "DejaVu Sans", Arial, sans-serif;
  page-break-after: avoid;
  page-break-inside: avoid;
}
h1 {
  color: #6b1f1f;
  font-size: 17pt;
  border-bottom: 2px solid #6b1f1f;
  padding-bottom: 4px;
  margin-top: 26px;
  page-break-before: always;
}
h2 {
  color: #1f3a5f;
  font-size: 13pt;
  border-bottom: 1px solid #c9b98a;
  padding-bottom: 3px;
  margin-top: 22px;
}
h3 { color: #6b1f1f; font-size: 11.5pt; margin-top: 16px; }
h4 { color: #1f3a5f; font-size: 10.5pt; }
a { color: #1f3a5f; }
table {
  border-collapse: collapse;
  width: 100%;
  margin: 10px 0 14px 0;
  font-size: 9pt;
  page-break-inside: auto;
}
tr { page-break-inside: avoid; }
thead { display: table-row-group; }
tr, td, th { page-break-inside: avoid !important; }
th {
  background: #f0e6cc;
  color: #241a12;
  text-align: left;
  border: 1px solid #c9b98a;
  padding: 4px 6px;
  font-family: "DejaVu Sans", Arial, sans-serif;
}
td { border: 1px solid #c9b98a; padding: 4px 6px; vertical-align: top; }
tbody tr:nth-child(even) td { background: #faf7ef; }
blockquote {
  background: #f8f2e8;
  border-left: 4px solid #c9b98a;
  margin: 10px 0;
  padding: 6px 12px;
  font-style: italic;
}
code {
  font-family: "DejaVu Sans Mono", monospace;
  font-size: 9pt;
  background: #f8f2e8;
  padding: 0 3px;
}
pre { background: #f8f2e8; border: 1px solid #c9b98a; padding: 8px; white-space: pre-wrap; }
hr { border: none; border-top: 1px solid #c9b98a; margin: 18px 0; }
/* Pas de saut de page avant le tout premier titre */
h1:first-of-type { page-break-before: avoid; }
</style>
