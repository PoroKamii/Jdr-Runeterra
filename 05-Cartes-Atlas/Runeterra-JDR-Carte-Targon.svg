<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="seaWaves" width="40" height="20" patternUnits="userSpaceOnUse">
  <path d="M0,10 Q10,4 20,10 T40,10" fill="none" stroke="#7d9c94" stroke-width="1.1" opacity="0.55"/>
  <path d="M0,17 Q10,11 20,17 T40,17" fill="none" stroke="#7d9c94" stroke-width="0.8" opacity="0.4"/>
</pattern>
<pattern id="iceLines" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
  <line x1="0" y1="0" x2="0" y2="26" stroke="#9fc4cf" stroke-width="1.4" opacity="0.5"/>
</pattern>
<pattern id="desertDots" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="5" cy="5" r="1.3" fill="#a9863f" opacity="0.5"/>
  <circle cx="15" cy="14" r="1.1" fill="#a9863f" opacity="0.4"/>
</pattern>
<pattern id="royalHatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <line x1="0" y1="0" x2="0" y2="18" stroke="#b89b5e" stroke-width="1" opacity="0.4"/>
</pattern>
<pattern id="rustHatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
  <line x1="0" y1="0" x2="0" y2="16" stroke="#7a3d24" stroke-width="1.6" opacity="0.45"/>
</pattern>
<pattern id="forestLight" width="30" height="30" patternUnits="userSpaceOnUse">
  <circle cx="7" cy="8" r="3" fill="#4f7a4a" opacity="0.5"/>
  <circle cx="20" cy="20" r="2.5" fill="#4f7a4a" opacity="0.4"/>
</pattern>
<pattern id="occupiedHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <line x1="0" y1="0" x2="0" y2="10" stroke="#8a2a2a" stroke-width="1.6" opacity="0.55"/>
</pattern>
<pattern id="brassHatch" width="14" height="14" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="14" y2="0" stroke="#8a6f3a" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#8a6f3a" stroke-width="1" opacity="0.4"/>
</pattern>
<pattern id="industrialHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
  <line x1="0" y1="0" x2="0" y2="12" stroke="#4a5a3e" stroke-width="2" opacity="0.35"/>
</pattern>
<pattern id="forestDark" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="6" cy="7" r="3.4" fill="#2f4a2a" opacity="0.55"/>
  <circle cx="18" cy="18" r="3" fill="#2f4a2a" opacity="0.5"/>
</pattern>
<pattern id="mountainChevrons" width="24" height="18" patternUnits="userSpaceOnUse">
  <path d="M2,16 L8,6 L14,16" fill="none" stroke="#5c4a6a" stroke-width="1.3" opacity="0.55"/>
</pattern>
<pattern id="sandHatch" width="16" height="8" patternUnits="userSpaceOnUse">
  <line x1="0" y1="4" x2="16" y2="4" stroke="#8a6a3a" stroke-width="1" stroke-dasharray="3,4" opacity="0.4"/>
</pattern>
<pattern id="mistSwirl" width="30" height="16" patternUnits="userSpaceOnUse">
  <path d="M0,8 Q7,2 15,8 T30,8" fill="none" stroke="#3a3a45" stroke-width="1.2" opacity="0.5"/>
</pattern>
<filter id="paperTexture" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" result="noise" seed="7"/>
  <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.24  0 0 0 0 0.15  0 0 0 0.06 0"/>
</filter>
</defs>

