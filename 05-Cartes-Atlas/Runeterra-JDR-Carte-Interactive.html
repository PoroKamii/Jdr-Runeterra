<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Runeterra — Carte du monde interactive</title>
<style>
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: #1c1712;
    color: #2b1e10;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 20px;
    padding: 20px;
  }
  #map-wrap {
    max-width: 900px;
    flex: 1 1 600px;
    background: #ecdfc0;
    border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  #map-wrap svg { width: 100%; height: auto; display: block; }
  .region { cursor: pointer; }
  .region:hover path:first-of-type { filter: brightness(1.12); }
  .region.selected path:first-of-type { stroke: #b8342a; stroke-width: 5; }
  #panel {
    flex: 0 0 340px;
    background: #f5ecd8;
    border: 3px solid #3b2a1a;
    border-radius: 8px;
    padding: 22px;
    min-height: 300px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #panel h2 {
    margin: 0 0 12px 0;
    font-size: 26px;
    border-bottom: 2px solid #3b2a1a;
    padding-bottom: 8px;
    letter-spacing: 1px;
  }
  #panel p { line-height: 1.5; font-size: 15px; }
  #panel .placeholder { color: #6b5c42; font-style: italic; }
  #panel .hint { margin-top: 18px; font-size: 12px; color: #7a6a4a; }
</style>
</head>

<script>
var REGION_DATA = {"freljord": {"label": "FRELJORD", "summary": "Trois tribus rivales sous un matriarcat guerrier. Avarosan et Gardiens du Givre viennent de s'unifier ; la Griffe d'Hiver refuse seule — une union fragile qui pourrait rompre au moindre choc. Sous l'Abîme Hurlant dort la Salle des Neuf, prison scellée des Guetteurs depuis la trahison de la cadette des trois sœurs fondatrices."}, "demacia": {"label": "DEMACIA", "summary": "Monarchie en crise de succession depuis l'assassinat du roi ; l'héritier Lightshield n'est pas encore couronné. Les Lois de Pierre interdisent la magie — sauf pour les Illuminateurs, un ordre secret qui protège les frontières par la magie même que le royaume proscrit. Grandes Maisons (Crownguard, Buvelle, Laurent, Durand) en compétition d'influence."}, "noxus": {"label": "NOXUS", "summary": "Méritocratie brutale dirigée par un Triumvirat (Force, Vision, et une Ruse dont l'identité reste un secret même pour les Noxiens). Capitale bâtie sur l'ancienne forteresse d'un tyran de fer immortel. Garde encore des territoires occupés en Ionia et des cités côtières shurimanes."}, "ionia": {"label": "IONIA", "summary": "Fédération de clans et de temples, animisme profond. Le retrait partiel de Noxus a laissé un vide de pouvoir entre trois factions : l'Ordre Shojin (isolationnisme pacifiste), la Confrérie de Navori (militarisation extrême) et l'Ordre de l'Ombre (vengeance). Noxus garde encore une île occupée sous un gouverneur traître."}, "piltover": {"label": "PILTOVER", "summary": "Gouvernée par un Conseil de marchands et d'inventeurs (Kiramman, Medarda, Ferros) qui régit officiellement Piltover et Zaun. Fondée sur l'Éthos après un cataclysme fondateur. La Maison Medarda cache une vieille guerre de succession jamais vraiment refermée."}, "zaun": {"label": "ZAUN", "summary": "Sous l'autorité du même Conseil que Piltover, mais les Barons Chimiques contrôlent le quotidien. Trois strates : Promenade (riches), Entresol (commerce), Puisard (misère). Voilée en permanence par la Grisaille, un smog toxique. Dépendance répandue au Shimmer."}, "shurima": {"label": "SHURIMA", "summary": "L'empire déchu s'est relevé sous un souverain Ascendu — mais une guerre de succession l'oppose à l'ancien traître, revenu Ascendu à son tour sous le nom de Xerath et proclamé empereur rival. Cités côtières occupées par Noxus, où une insurrection échange des armes avec la Maison Medarda. Culte solaire, l'ascension comme but ultime."}, "ixtal": {"label": "IXTAL", "summary": "Conseil des Yun Tal, méritocratie élémentaire isolationniste. La frontière se défend par magie (tempêtes, brouillard, terrain mouvant). Skarner, un Brackern fondateur, veille depuis une chambre secrète — méfiant des Yun Tal depuis leur alliance passée avec Shurima. Malphite, fragment du Monolithe détruit, est lié à cette histoire."}, "kumungu": {"label": "Kumungu", "summary": "Vaste jungle au nord du territoire shurimais, jadis cœur d'une nation engloutie par la végétation. Aucune autorité centrale, faune féroce, secrets enfouis. Les rares peuples locaux se méfient des expéditions étrangères venues chercher richesses et reliques."}, "targon": {"label": "TARGON", "summary": "Théocratie duale : les Solari vénèrent le Soleil et traquent l'hérésie Lunari, exilée et clandestine. Le Marus Omegnum (sanctuaire Lunari) ne se matérialise que lors d'événements célestes rares. En arrière-plan, le Forgeron d'Étoiles — un dragon-dieu jadis emprisonné — revient, libre et vengeur."}, "bilgewater": {"label": "BILGEWATER", "summary": "Aucun gouvernement stable : seul le Tableau des Primes fait office de loi. L'ancien Conclave des Corsaires a été éliminé par une capitaine qui règne désormais seule — autorité très contestée, rumeur persistante que l'ancien tyran complote en secret pour revenir."}, "shadowisles": {"label": "ÎLES OBSCURES", "summary": "Ancienne cité d'Helia, ruinée par le chagrin devenu folie d'un roi voulant ressusciter son épouse. La Brume Noire s'en échappe encore ; le roi déchu qui la hante a récemment été mis en échec, mais la paix reste fragile. Les Sentinelles de la Lumière, gardiennes d'Helia depuis l'origine, la contiennent activement."}, "void": {"label": "LE NÉANT (Icathia)", "summary": "Aucune politique, une force de la nature hostile née de la rupture provoquée par la cité rebelle d'Icathia lors de sa révolte contre l'ancien empire shurimais. Menace universelle redoutée par toutes les régions — un bon prétexte pour forcer une coopération entre ennemis jurés."}, "bandle": {"label": "Bandle City", "summary": "Conseil communautaire à la gouvernance légère, célébrant la créativité individuelle. N'est jamais accessible par la route : poche autonome du Royaume des Esprits reliée par de multiples portails discrets, chacun avec sa propre condition d'ouverture."}, "lafaille": {"label": "La Faille", "summary": "Champ de Justice le plus ancien et le plus vénéré de Runeterra, niché dans une forêt reculée entre le Freljord, la rivière Serpentine et les monts Ironspine. Site de plusieurs batailles pendant les Guerres Runiques. Comme les trois autres Champs de Justice (Abîme Hurlant, Brèche de Cristal, Forêt Torturée), c'était une arène neutre où des champions réglaient jadis des conflits entre nations par le combat plutôt que par la guerre ouverte — une pratique tombée en désuétude depuis longtemps."}, "abimehurlant": {"label": "L'Abîme Hurlant", "summary": "Champ de Justice du Freljord, bâti sur le pont où la cadette des trois sœurs fondatrices a trahi ses aînées pour sceller les Guetteurs. Tout au fond se trouve la Salle des Neuf, surveillée chaque année par les Gardiens du Givre."}, "brechedecristal": {"label": "La Brèche de Cristal", "summary": "Champ de Justice shurimais, un cratère magique au nord-ouest de Shurima, lié aux Brackern d'Ixtal."}, "forettorturee": {"label": "La Forêt Torturée", "summary": "Champ de Justice au cœur des Îles Obscures, une forêt maudite gardée par la même entité arachnéenne que le Culte de l'Araignée y vénère déjà."}};

(function() {
  var panelContent = document.getElementById('panel-content');
  var regions = document.querySelectorAll('.region');

  function selectRegion(el, key) {
    for (var i = 0; i < regions.length; i++) {
      regions[i].setAttribute('class', regions[i].getAttribute('class').replace(' selected', ''));
    }
    el.setAttribute('class', el.getAttribute('class') + ' selected');
    var data = REGION_DATA[key];
    if (!data) return;
    var html = '<h2>' + data.label + '</h2>' +
               '<p>' + data.summary + '</p>';
    panelContent.innerHTML = html;
  }

  for (var i = 0; i < regions.length; i++) {
    (function(el) {
      var key = el.getAttribute('data-region');
      el.addEventListener('click', function() {
        selectRegion(el, key);
      });
    })(regions[i]);
  }
})();
</script>

</body>
</html>
