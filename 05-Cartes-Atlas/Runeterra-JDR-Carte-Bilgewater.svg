<path d="M 290,231 L 292.6,237 L 299,237 L 293.6,241.2 L 295.6,247.5 L 290,243.5 L 284.4,247.5 L 286.4,241.2 L 281,237 L 287.4,237 Z" fill="#c9a227" stroke="#3b2a1a" stroke-width="1"/><text x="304" y="234" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2b1e10">Bilgewater (Rat Town)</text><text x="304" y="247" text-anchor="start" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#5a4a30">port principal, quais du Boucher</text>
